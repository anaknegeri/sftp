syntax = "proto3";

package export;

option go_package = "pkg/pb";

// Export service definition
service ExportService {
  // Export daily reports for all locations
  rpc ExportDaily(ExportDailyRequest) returns (ExportResponse);

  // Export 30-minute cumulative reports for all locations
  rpc Export30Min(Export30MinRequest) returns (ExportResponse);

  // Export all reports (daily + 30min windows) for all locations
  rpc ExportAllReport(ExportAllReportRequest) returns (ExportResponse);

  // Export daily report for specific location
  rpc ExportByLocationID(ExportByLocationIDRequest) returns (ExportResponse);

  // Export 30-minute cumulative report for specific location
  rpc Export30MinByLocationID(Export30MinByLocationIDRequest) returns (ExportResponse);

  // Export all reports for specific location
  rpc ExportAllReportByLocationID(ExportAllReportByLocationIDRequest) returns (ExportResponse);
}

// Request messages
message ExportDailyRequest {
  string tenant_id = 1;
  string date = 2;
}

message Export30MinRequest {
  string tenant_id = 1;
  string date_time = 2;
}

message ExportAllReportRequest {
  string tenant_id = 1;
  string date = 2;
}

message ExportByLocationIDRequest {
  string tenant_id = 1;
  string location_id = 2;
  string date = 3;
}

message Export30MinByLocationIDRequest {
  string tenant_id = 1;
  string location_id = 2;
  string date_time = 3;
}

message ExportAllReportByLocationIDRequest {
  string tenant_id = 1;
  string location_id = 2;
  string date = 3;
}

// Response messages
message ExportResponse {
  bool success = 1;
  string message = 2;
  ExportStats stats = 3;
}

message ExportStats {
  int32 total_locations = 1;
  int32 processed_locations = 2;
  int32 failed_locations = 3;
  int32 total_records = 4;
  repeated LocationStats location_stats = 5;
}

message LocationStats {
  string location_id = 1;
  string location_code = 2;
  bool success = 3;
  string error_message = 4;
  int32 daily_records = 5;
  int32 window_records = 6;
  int32 total_windows = 7;
}
